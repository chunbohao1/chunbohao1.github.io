<script>
document.addEventListener('DOMContentLoaded', function () {
  {{ if .Site.Params.googleScholarStatsUseCDN }}
  var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ .Site.Params.repository }}@';
  {{ else }}
  var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ .Site.Params.repository }}/';
  {{ end }}

  fetch(gsDataBaseUrl + 'google-scholar-stats/gs_data.json')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var totalCitation = data['citedby'];
      var el = document.getElementById('total_cit');
      if (el) el.innerHTML = totalCitation;

      var citationEles = document.getElementsByClassName('show_paper_citations');
      Array.prototype.forEach.call(citationEles, function (element) {
        var paperId = element.getAttribute('data');
        if (data['publications'] && data['publications'][paperId]) {
          var numCitations = data['publications'][paperId]['num_citations'];
          element.innerHTML = '| Citations: ' + numCitations;
        }
      });
    })
    .catch(function (err) { console.log('Scholar stats fetch failed:', err); });
});
</script>
